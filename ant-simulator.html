<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ant Colony Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            user-select: none;
        }
        h1 { margin-bottom: 10px; color: #f39c12; }
        .game-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        canvas { border: 3px solid #444; border-radius: 8px; cursor: crosshair; }
        .panel {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            min-width: 280px;
            max-height: 700px;
            overflow-y: auto;
        }
        .panel h2 { color: #f39c12; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .stat { display: flex; justify-content: space-between; margin-bottom: 8px; padding: 6px 8px; background: #1a1a2e; border-radius: 4px; }
        .stat-label { color: #aaa; }
        .stat-value { font-weight: bold; color: #4ecca3; }
        .stat-value.warning { color: #f39c12; }
        .stat-value.danger { color: #e74c3c; }
        .tools { margin-top: 15px; }
        .tools h3 { color: #ddd; margin-bottom: 10px; }
        .tool-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: 3px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tool-btn.active { border-color: #fff; transform: scale(1.02); }
        .tool-btn:hover { transform: scale(1.02); }
        .btn-dig { background: #8B4513; color: white; }
        .btn-farm { background: #228B22; color: white; }
        .btn-none { background: #555; color: white; }
        .brush-size { margin-top: 10px; }
        .brush-size label { display: block; margin-bottom: 5px; color: #aaa; }
        .brush-size input { width: 100%; }
        .instructions { margin-top: 15px; padding: 10px; background: #1a1a2e; border-radius: 4px; font-size: 12px; color: #aaa; }
        .instructions p { margin-bottom: 5px; }
        .game-over { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 40px; border-radius: 10px; text-align: center; display: none; z-index: 100; }
        .game-over h2 { color: #e74c3c; margin-bottom: 20px; }
        .game-over button { padding: 10px 30px; background: #4ecca3; color: #1a1a2e; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Ant Colony Simulator</h1>
    <div class="game-container">
        <canvas id="gameCanvas" width="960" height="640"></canvas>
        <div class="panel">
            <h2>Colony Status</h2>
            <div class="stat"><span class="stat-label">Food:</span><span class="stat-value" id="foodCount">50</span></div>
            <div class="stat"><span class="stat-label">Queen:</span><span class="stat-value">Alive</span></div>
            <div class="stat"><span class="stat-label">Eggs:</span><span class="stat-value" id="eggCount">0</span></div>
            <div class="stat"><span class="stat-label">Workers:</span><span class="stat-value" id="workerCount">0</span></div>
            <div class="stat"><span class="stat-label">Farms:</span><span class="stat-value" id="farmCount">0</span></div>
            <div class="stat"><span class="stat-label">Food/sec:</span><span class="stat-value" id="foodRate">0</span></div>

            <div class="tools">
                <h3>Tools</h3>
                <button class="tool-btn btn-none active" id="btnSelect" onclick="setTool('none')">Select (None)</button>
                <button class="tool-btn btn-dig" id="btnDig" onclick="setTool('dig')">Dig Tunnel (Brush)</button>
                <button class="tool-btn btn-farm" id="btnFarm" onclick="setTool('farm')">Place Farm (Click)</button>

                <div class="brush-size" id="brushControls">
                    <label>Brush Size: <span id="brushSizeLabel">20</span>px</label>
                    <input type="range" min="10" max="50" value="20" id="brushSize" oninput="updateBrushSize()">
                </div>
            </div>

            <div class="instructions">
                <p><strong>Controls:</strong></p>
                <p><b>Dig:</b> Click & drag to paint tunnels</p>
                <p><b>Farm:</b> Click in tunnel to place</p>
                <p>Workers auto-dig marked areas</p>
                <p>Farms: +5 food/20sec</p>
            </div>
        </div>
    </div>
    <div class="game-over" id="gameOver">
        <h2>Colony Collapsed!</h2>
        <p>Your colony ran out of food.</p><br>
        <button onclick="location.reload()">Try Again</button>
    </div>

    <script>
        const CELL_SIZE = 8;
        const GRID_WIDTH = 120;
        const GRID_HEIGHT = 80;
        const SURFACE_Y = 10;
        const ANT_SPEED = 0.04;

        const EGG_HATCH_TIME = 5000;
        const QUEEN_LAY_INTERVAL = 5000;
        const FOOD_CONSUME_INTERVAL = 20000;
        const FARM_PRODUCE_INTERVAL = 20000;
        const FARM_FOOD_AMOUNT = 5;
        const DIG_TIME = 800;

        const CELL_SKY = 0, CELL_GRASS = 1, CELL_DIRT = 2, CELL_TUNNEL = 3, CELL_MARKED = 4;
        const TASK_IDLE = 'idle', TASK_DIG = 'dig', TASK_FARM = 'farm';

        let canvas, ctx, grid = [], ants = [], eggs = [], farms = [];
        let queen = null, food = 50, gameRunning = true;
        let lastFoodConsume = Date.now(), lastQueenLay = Date.now();

        // Tool state
        let currentTool = 'none';
        let brushSize = 20;
        let isMouseDown = false;
        let lastMouseX = 0, lastMouseY = 0;

        function initGrid() {
            grid = [];
            for (let y = 0; y < GRID_HEIGHT; y++) {
                grid[y] = [];
                for (let x = 0; x < GRID_WIDTH; x++) {
                    if (y < SURFACE_Y) grid[y][x] = CELL_SKY;
                    else if (y === SURFACE_Y) grid[y][x] = CELL_GRASS;
                    else grid[y][x] = CELL_DIRT;
                }
            }
            // Create initial tunnel
            const cx = Math.floor(GRID_WIDTH / 2);
            for (let y = SURFACE_Y; y <= SURFACE_Y + 20; y++) {
                for (let dx = -3; dx <= 3; dx++) {
                    if (cx + dx >= 0 && cx + dx < GRID_WIDTH) grid[y][cx + dx] = CELL_TUNNEL;
                }
            }
            // Queen chamber
            for (let x = cx - 10; x <= cx + 10; x++) {
                for (let y = SURFACE_Y + 16; y <= SURFACE_Y + 24; y++) {
                    if (x >= 0 && x < GRID_WIDTH && y < GRID_HEIGHT) grid[y][x] = CELL_TUNNEL;
                }
            }
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tool === 'dig' ? 'btnDig' : tool === 'farm' ? 'btnFarm' : 'btnSelect').classList.add('active');
            document.getElementById('brushControls').style.display = tool === 'dig' ? 'block' : 'none';
            canvas.style.cursor = tool === 'dig' ? 'crosshair' : tool === 'farm' ? 'pointer' : 'default';
        }

        function updateBrushSize() {
            brushSize = parseInt(document.getElementById('brushSize').value);
            document.getElementById('brushSizeLabel').textContent = brushSize;
        }

        function paintTunnel(px, py) {
            const radius = brushSize / 2;
            const startX = Math.floor((px - radius) / CELL_SIZE);
            const endX = Math.ceil((px + radius) / CELL_SIZE);
            const startY = Math.floor((py - radius) / CELL_SIZE);
            const endY = Math.ceil((py + radius) / CELL_SIZE);

            for (let y = startY; y <= endY; y++) {
                for (let x = startX; x <= endX; x++) {
                    if (x >= 0 && x < GRID_WIDTH && y > SURFACE_Y && y < GRID_HEIGHT) {
                        const cellCX = x * CELL_SIZE + CELL_SIZE / 2;
                        const cellCY = y * CELL_SIZE + CELL_SIZE / 2;
                        const dist = Math.sqrt((cellCX - px) ** 2 + (cellCY - py) ** 2);
                        if (dist <= radius && grid[y][x] === CELL_DIRT) {
                            grid[y][x] = CELL_MARKED; // Mark for digging
                        }
                    }
                }
            }
        }

        function placeFarm(px, py) {
            const gx = Math.floor(px / CELL_SIZE);
            const gy = Math.floor(py / CELL_SIZE);
            if (gx >= 0 && gx < GRID_WIDTH && gy >= 0 && gy < GRID_HEIGHT) {
                if (grid[gy][gx] === CELL_TUNNEL) {
                    // Check not too close to other farms
                    const tooClose = farms.some(f => Math.sqrt((f.px - px) ** 2 + (f.py - py) ** 2) < 30);
                    if (!tooClose) {
                        farms.push(new Farm(px, py));
                    }
                }
            }
        }

        // Drawing functions
        function drawQueen(px, py) {
            ctx.save();
            ctx.translate(px, py);

            ctx.strokeStyle = '#2C1810';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 3; i++) {
                const legY = -4 + i * 4;
                ctx.beginPath(); ctx.moveTo(-4, legY); ctx.lineTo(-12, legY - 4 + i * 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(4, legY); ctx.lineTo(12, legY - 4 + i * 2); ctx.stroke();
            }

            ctx.fillStyle = '#1C1008';
            ctx.beginPath();
            ctx.ellipse(-12, 0, 14, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#D4882C';
            ctx.beginPath(); ctx.ellipse(-18, 0, 3, 8, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#C07820';
            ctx.beginPath(); ctx.ellipse(-12, 0, 2.5, 9, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#D4882C';
            ctx.beginPath(); ctx.ellipse(-6, 0, 2, 7, 0, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#1C1008';
            ctx.beginPath(); ctx.ellipse(4, 0, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(12, 0, 5, 4, 0, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = '#2C1810';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(16, -2); ctx.lineTo(20, -4); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(16, 2); ctx.lineTo(20, 4); ctx.stroke();

            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(14, -3); ctx.quadraticCurveTo(18, -8, 22, -10); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(14, 3); ctx.quadraticCurveTo(18, 8, 22, 10); ctx.stroke();

            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(14, -2, 1.5, 0, Math.PI * 2);
            ctx.arc(14, 2, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawWorkerAnt(px, py, angle, workProgress) {
            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(angle);

            const bodyColor = '#3D1A0A';
            ctx.strokeStyle = bodyColor;
            ctx.lineWidth = 1;
            for (let i = 0; i < 3; i++) {
                const legY = -2 + i * 2;
                ctx.beginPath(); ctx.moveTo(-2, legY); ctx.lineTo(-6, legY - 2 + i); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(2, legY); ctx.lineTo(6, legY - 2 + i); ctx.stroke();
            }

            ctx.fillStyle = bodyColor;
            ctx.beginPath(); ctx.ellipse(-4, 0, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(1, 0, 3, 2.5, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(5, 0, 2.5, 2, 0, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = bodyColor;
            ctx.lineWidth = 0.8;
            ctx.beginPath(); ctx.moveTo(6, -1); ctx.quadraticCurveTo(8, -3, 9, -4); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(6, 1); ctx.quadraticCurveTo(8, 3, 9, 4); ctx.stroke();

            ctx.restore();

            if (workProgress > 0) {
                const barWidth = 16;
                const progress = workProgress / DIG_TIME;
                ctx.fillStyle = '#222';
                ctx.fillRect(px - barWidth/2, py - 12, barWidth, 3);
                ctx.fillStyle = '#F39C12';
                ctx.fillRect(px - barWidth/2, py - 12, barWidth * progress, 3);
            }
        }

        function drawEgg(px, py, progress) {
            ctx.fillStyle = '#FFF8DC';
            ctx.beginPath();
            ctx.ellipse(px, py, 4, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#DAA520';
            ctx.lineWidth = 1;
            ctx.stroke();

            const barWidth = 12;
            ctx.fillStyle = '#333';
            ctx.fillRect(px - barWidth/2, py + 8, barWidth, 2);
            ctx.fillStyle = '#E74C3C';
            ctx.fillRect(px - barWidth/2, py + 8, barWidth * progress, 2);
        }

        function drawFarm(px, py) {
            // Farm is a circular area with plants
            ctx.fillStyle = '#5D4037';
            ctx.beginPath();
            ctx.arc(px, py, 12, 0, Math.PI * 2);
            ctx.fill();

            // Plants around the center
            const plantAngles = [0, Math.PI/2, Math.PI, Math.PI*1.5, Math.PI/4, Math.PI*3/4];
            plantAngles.forEach(angle => {
                const plantX = px + Math.cos(angle) * 6;
                const plantY = py + Math.sin(angle) * 6;
                ctx.strokeStyle = '#2E7D32';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(plantX, plantY + 3);
                ctx.lineTo(plantX, plantY - 3);
                ctx.stroke();
                ctx.fillStyle = '#4CAF50';
                ctx.beginPath();
                ctx.ellipse(plantX - 2, plantY - 1, 2, 1, -0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(plantX + 2, plantY - 1, 2, 1, 0.5, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        class Ant {
            constructor(px, py, isQueen = false) {
                this.px = px;
                this.py = py;
                this.isQueen = isQueen;
                this.task = TASK_IDLE;
                this.targetPx = null;
                this.targetPy = null;
                this.targetGx = null;
                this.targetGy = null;
                this.workProgress = 0;
                this.angle = Math.random() * Math.PI * 2;
            }

            getGridX() { return Math.floor(this.px / CELL_SIZE); }
            getGridY() { return Math.floor(this.py / CELL_SIZE); }

            canMoveToPixel(px, py) {
                const gx = Math.floor(px / CELL_SIZE);
                const gy = Math.floor(py / CELL_SIZE);
                if (gx < 0 || gx >= GRID_WIDTH || gy < 0 || gy >= GRID_HEIGHT) return false;
                const cell = grid[gy][gx];
                return cell === CELL_TUNNEL || cell === CELL_GRASS || cell === CELL_MARKED;
            }

            findDigTarget() {
                // Find nearest marked cell
                let nearest = null;
                let nearestDist = Infinity;
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    for (let x = 0; x < GRID_WIDTH; x++) {
                        if (grid[y][x] === CELL_MARKED) {
                            const cellPx = x * CELL_SIZE + CELL_SIZE / 2;
                            const cellPy = y * CELL_SIZE + CELL_SIZE / 2;
                            const dist = Math.sqrt((this.px - cellPx) ** 2 + (this.py - cellPy) ** 2);
                            if (dist < nearestDist) {
                                nearestDist = dist;
                                nearest = {gx: x, gy: y, px: cellPx, py: cellPy};
                            }
                        }
                    }
                }
                return nearest;
            }

            update(deltaTime) {
                if (this.isQueen) return;

                if (this.task === TASK_IDLE) {
                    // Look for work
                    const target = this.findDigTarget();
                    if (target) {
                        this.task = TASK_DIG;
                        this.targetPx = target.px;
                        this.targetPy = target.py;
                        this.targetGx = target.gx;
                        this.targetGy = target.gy;
                    } else {
                        this.wander(deltaTime);
                    }
                } else if (this.task === TASK_DIG) {
                    this.performDigging(deltaTime);
                } else {
                    this.wander(deltaTime);
                }
            }

            performDigging(deltaTime) {
                if (this.targetGx === null || grid[this.targetGy][this.targetGx] !== CELL_MARKED) {
                    this.task = TASK_IDLE;
                    this.workProgress = 0;
                    return;
                }

                const dist = Math.sqrt((this.px - this.targetPx) ** 2 + (this.py - this.targetPy) ** 2);
                if (dist < CELL_SIZE * 2) {
                    this.workProgress += deltaTime;
                    if (this.workProgress >= DIG_TIME) {
                        grid[this.targetGy][this.targetGx] = CELL_TUNNEL;
                        this.workProgress = 0;
                        this.task = TASK_IDLE;
                    }
                } else {
                    this.moveTowards(this.targetPx, this.targetPy, deltaTime);
                }
            }

            moveTowards(tx, ty, deltaTime) {
                const dx = tx - this.px;
                const dy = ty - this.py;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 1) return;

                const speed = ANT_SPEED * deltaTime;
                const nx = this.px + (dx / dist) * speed;
                const ny = this.py + (dy / dist) * speed;

                if (this.canMoveToPixel(nx, ny)) {
                    this.px = nx;
                    this.py = ny;
                    this.angle = Math.atan2(dy, dx);
                } else {
                    // Try to find alternative path
                    const angles = [0.5, -0.5, 1, -1, 1.5, -1.5];
                    for (const offset of angles) {
                        const newAngle = this.angle + offset;
                        const altX = this.px + Math.cos(newAngle) * speed;
                        const altY = this.py + Math.sin(newAngle) * speed;
                        if (this.canMoveToPixel(altX, altY)) {
                            this.px = altX;
                            this.py = altY;
                            this.angle = newAngle;
                            break;
                        }
                    }
                }
            }

            wander(deltaTime) {
                this.angle += (Math.random() - 0.5) * 0.1;
                const speed = ANT_SPEED * deltaTime * 0.4;
                const nx = this.px + Math.cos(this.angle) * speed;
                const ny = this.py + Math.sin(this.angle) * speed;

                if (this.canMoveToPixel(nx, ny)) {
                    this.px = nx;
                    this.py = ny;
                } else {
                    this.angle += Math.PI / 2 + Math.random();
                }
            }

            draw() {
                if (this.isQueen) {
                    drawQueen(this.px, this.py);
                } else {
                    drawWorkerAnt(this.px, this.py, this.angle, this.workProgress);
                }
            }
        }

        class Egg {
            constructor(px, py) {
                this.px = px;
                this.py = py;
                this.createdAt = Date.now();
            }
            isReady() { return Date.now() - this.createdAt >= EGG_HATCH_TIME; }
            getProgress() { return (Date.now() - this.createdAt) / EGG_HATCH_TIME; }
            draw() { drawEgg(this.px, this.py, this.getProgress()); }
        }

        class Farm {
            constructor(px, py) {
                this.px = px;
                this.py = py;
                this.lastProduce = Date.now();
            }
            update() {
                if (Date.now() - this.lastProduce >= FARM_PRODUCE_INTERVAL) {
                    food += FARM_FOOD_AMOUNT;
                    this.lastProduce = Date.now();
                }
            }
            draw() { drawFarm(this.px, this.py); }
        }

        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            initGrid();

            const queenPx = (GRID_WIDTH / 2) * CELL_SIZE;
            const queenPy = (SURFACE_Y + 20) * CELL_SIZE;
            queen = new Ant(queenPx, queenPy, true);

            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('mouseleave', onMouseUp);

            setTool('none');
            requestAnimationFrame(gameLoop);
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function onMouseDown(e) {
            isMouseDown = true;
            const pos = getMousePos(e);
            lastMouseX = pos.x;
            lastMouseY = pos.y;

            if (currentTool === 'dig') {
                paintTunnel(pos.x, pos.y);
            } else if (currentTool === 'farm') {
                placeFarm(pos.x, pos.y);
            }
        }

        function onMouseMove(e) {
            const pos = getMousePos(e);

            if (isMouseDown && currentTool === 'dig') {
                // Interpolate between last and current position for smooth painting
                const dx = pos.x - lastMouseX;
                const dy = pos.y - lastMouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const steps = Math.max(1, Math.floor(dist / (brushSize / 4)));

                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const x = lastMouseX + dx * t;
                    const y = lastMouseY + dy * t;
                    paintTunnel(x, y);
                }
            }

            lastMouseX = pos.x;
            lastMouseY = pos.y;
        }

        function onMouseUp() {
            isMouseDown = false;
        }

        function updateStats() {
            const total = ants.length + 1;
            const produced = farms.length * FARM_FOOD_AMOUNT / (FARM_PRODUCE_INTERVAL / 1000);
            const consumed = total / (FOOD_CONSUME_INTERVAL / 1000);
            const rate = (produced - consumed).toFixed(2);

            document.getElementById('foodCount').textContent = Math.floor(food);
            document.getElementById('eggCount').textContent = eggs.length;
            document.getElementById('workerCount').textContent = ants.length;
            document.getElementById('farmCount').textContent = farms.length;
            document.getElementById('foodRate').textContent = rate;

            const foodEl = document.getElementById('foodCount');
            foodEl.className = 'stat-value' + (food < 10 ? ' danger' : food < 30 ? ' warning' : '');
            const rateEl = document.getElementById('foodRate');
            rateEl.className = 'stat-value' + (parseFloat(rate) < 0 ? ' danger' : parseFloat(rate) < 0.1 ? ' warning' : '');
        }

        let lastTime = Date.now();
        function gameLoop() {
            if (!gameRunning) return;
            const now = Date.now();
            const deltaTime = now - lastTime;
            lastTime = now;
            update(deltaTime);
            render();
            updateStats();
            requestAnimationFrame(gameLoop);
        }

        function update(deltaTime) {
            const now = Date.now();

            // Queen lays eggs
            if (now - lastQueenLay >= QUEEN_LAY_INTERVAL) {
                const radius = 40;
                for (let attempt = 0; attempt < 10; attempt++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.random() * radius + 10;
                    const epx = queen.px + Math.cos(angle) * dist;
                    const epy = queen.py + Math.sin(angle) * dist;
                    const gx = Math.floor(epx / CELL_SIZE);
                    const gy = Math.floor(epy / CELL_SIZE);
                    if (gx >= 0 && gx < GRID_WIDTH && gy >= 0 && gy < GRID_HEIGHT && grid[gy][gx] === CELL_TUNNEL) {
                        if (!eggs.some(e => Math.sqrt((e.px - epx) ** 2 + (e.py - epy) ** 2) < 15)) {
                            eggs.push(new Egg(epx, epy));
                            break;
                        }
                    }
                }
                lastQueenLay = now;
            }

            // Hatch eggs
            for (let i = eggs.length - 1; i >= 0; i--) {
                if (eggs[i].isReady()) {
                    const egg = eggs[i];
                    const newAnt = new Ant(egg.px, egg.py, false);
                    ants.push(newAnt);
                    eggs.splice(i, 1);
                }
            }

            for (const ant of ants) ant.update(deltaTime);
            for (const farm of farms) farm.update();

            // Consume food
            if (now - lastFoodConsume >= FOOD_CONSUME_INTERVAL) {
                food -= ants.length + 1;
                lastFoodConsume = now;
                if (food <= 0) {
                    gameRunning = false;
                    document.getElementById('gameOver').style.display = 'block';
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            for (let y = 0; y < GRID_HEIGHT; y++) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    const cell = grid[y][x];
                    const sx = x * CELL_SIZE, sy = y * CELL_SIZE;

                    if (cell === CELL_SKY) {
                        ctx.fillStyle = '#87CEEB';
                    } else if (cell === CELL_GRASS) {
                        ctx.fillStyle = '#228B22';
                    } else if (cell === CELL_DIRT) {
                        const shade = ((x * 7 + y * 13) % 20) - 10;
                        ctx.fillStyle = `rgb(${139 + shade}, ${69 + shade/2}, ${19 + shade/3})`;
                    } else if (cell === CELL_TUNNEL) {
                        ctx.fillStyle = '#D4C4A8';
                    } else if (cell === CELL_MARKED) {
                        ctx.fillStyle = '#E8D8B8'; // Lighter beige for marked
                    }
                    ctx.fillRect(sx, sy, CELL_SIZE, CELL_SIZE);
                }
            }

            // Draw tunnel edges (white highlight)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 1;
            for (let y = 0; y < GRID_HEIGHT; y++) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    const cell = grid[y][x];
                    if (cell === CELL_TUNNEL || cell === CELL_MARKED) {
                        const sx = x * CELL_SIZE, sy = y * CELL_SIZE;
                        if (y > 0 && grid[y-1][x] === CELL_DIRT) {
                            ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + CELL_SIZE, sy); ctx.stroke();
                        }
                        if (y < GRID_HEIGHT-1 && grid[y+1][x] === CELL_DIRT) {
                            ctx.beginPath(); ctx.moveTo(sx, sy + CELL_SIZE); ctx.lineTo(sx + CELL_SIZE, sy + CELL_SIZE); ctx.stroke();
                        }
                        if (x > 0 && grid[y][x-1] === CELL_DIRT) {
                            ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + CELL_SIZE); ctx.stroke();
                        }
                        if (x < GRID_WIDTH-1 && grid[y][x+1] === CELL_DIRT) {
                            ctx.beginPath(); ctx.moveTo(sx + CELL_SIZE, sy); ctx.lineTo(sx + CELL_SIZE, sy + CELL_SIZE); ctx.stroke();
                        }
                    }
                }
            }

            // Draw marked areas highlight
            ctx.fillStyle = 'rgba(255, 165, 0, 0.3)';
            for (let y = 0; y < GRID_HEIGHT; y++) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    if (grid[y][x] === CELL_MARKED) {
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }

            // Draw brush preview
            if (currentTool === 'dig' && lastMouseX > 0) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.arc(lastMouseX, lastMouseY, brushSize / 2, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Draw farms
            for (const farm of farms) farm.draw();

            // Draw eggs
            for (const egg of eggs) egg.draw();

            // Draw queen
            queen.draw();

            // Draw workers
            for (const ant of ants) ant.draw();
        }

        window.onload = init;
    </script>
</body>
</html>
