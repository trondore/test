<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ant Colony Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; color: #f39c12; }
        .game-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        canvas { border: 3px solid #444; border-radius: 8px; cursor: pointer; }
        .panel {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            min-width: 280px;
            max-height: 700px;
            overflow-y: auto;
        }
        .panel h2 { color: #f39c12; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .stat { display: flex; justify-content: space-between; margin-bottom: 8px; padding: 6px 8px; background: #1a1a2e; border-radius: 4px; }
        .stat-label { color: #aaa; }
        .stat-value { font-weight: bold; color: #4ecca3; }
        .stat-value.warning { color: #f39c12; }
        .stat-value.danger { color: #e74c3c; }
        button { width: 100%; padding: 10px; margin-bottom: 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .btn-dig { background: #8B4513; color: white; }
        .btn-farm { background: #228B22; color: white; }
        .selected-info { margin-top: 15px; padding: 12px; background: #2a2a4e; border-radius: 4px; border: 2px solid #4ecca3; }
        .selected-info.dirt { border-color: #8B4513; }
        .selected-info.tunnel { border-color: #D4C4A8; }
        .selected-info.farm { border-color: #32CD32; }
        .instructions { margin-top: 15px; padding: 10px; background: #1a1a2e; border-radius: 4px; font-size: 12px; color: #aaa; }
        .instructions p { margin-bottom: 5px; }
        .idle-count { color: #f39c12; font-size: 12px; margin-top: 8px; }
        .game-over { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 40px; border-radius: 10px; text-align: center; display: none; z-index: 100; }
        .game-over h2 { color: #e74c3c; margin-bottom: 20px; }
        .game-over button { width: auto; padding: 10px 30px; background: #4ecca3; color: #1a1a2e; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Ant Colony Simulator</h1>
    <div class="game-container">
        <canvas id="gameCanvas" width="960" height="640"></canvas>
        <div class="panel">
            <h2>Colony Status</h2>
            <div class="stat"><span class="stat-label">Food:</span><span class="stat-value" id="foodCount">50</span></div>
            <div class="stat"><span class="stat-label">Queen:</span><span class="stat-value" id="queenStatus">Alive</span></div>
            <div class="stat"><span class="stat-label">Eggs:</span><span class="stat-value" id="eggCount">0</span></div>
            <div class="stat"><span class="stat-label">Workers:</span><span class="stat-value" id="workerCount">0</span></div>
            <div class="stat"><span class="stat-label">Idle:</span><span class="stat-value" id="idleCount">0</span></div>
            <div class="stat"><span class="stat-label">Diggers:</span><span class="stat-value" id="diggerCount">0</span></div>
            <div class="stat"><span class="stat-label">Farmers:</span><span class="stat-value" id="farmerCount">0</span></div>
            <div class="stat"><span class="stat-label">Farms:</span><span class="stat-value" id="farmCount">0</span></div>
            <div class="stat"><span class="stat-label">Food/sec:</span><span class="stat-value" id="foodRate">0</span></div>
            <div class="selected-info" id="selectedInfo" style="display: none;">
                <strong id="selectedTitle">Selected:</strong>
                <p id="selectedDesc"></p>
                <div id="actionButtons"></div>
                <p class="idle-count" id="idleNote"></p>
            </div>
            <div class="instructions">
                <p><strong>How to Play:</strong></p>
                <p>Click DIRT next to tunnels to dig</p>
                <p>Click TUNNEL to build a farm</p>
                <p>Click FARM to assign farmers</p>
            </div>
        </div>
    </div>
    <div class="game-over" id="gameOver">
        <h2>Colony Collapsed!</h2>
        <p>Your colony ran out of food.</p><br>
        <button onclick="location.reload()">Try Again</button>
    </div>

    <script>
        const CELL_SIZE = 16;
        const GRID_WIDTH = 60;
        const GRID_HEIGHT = 40;
        const SURFACE_Y = 5;
        const ANT_SPEED = 0.03;

        const EGG_HATCH_TIME = 5000;
        const QUEEN_LAY_INTERVAL = 5000;
        const FOOD_CONSUME_INTERVAL = 20000;
        const FARM_PRODUCE_INTERVAL = 20000;
        const FARM_FOOD_AMOUNT = 5;
        const DIG_TIME = 2500;
        const FARM_BUILD_TIME = 2500;

        const CELL_SKY = 0, CELL_GRASS = 1, CELL_DIRT = 2, CELL_TUNNEL = 3, CELL_FARM = 4;
        const TASK_IDLE = 'idle', TASK_DIG = 'dig', TASK_FARM = 'farm';

        let canvas, ctx, grid = [], ants = [], eggs = [], farms = [];
        let queen = null, food = 50, gameRunning = true;
        let lastFoodConsume = Date.now(), lastQueenLay = Date.now();
        let selectedCell = null, highlightedCell = null;
        let digQueue = [], farmQueue = [];

        function initGrid() {
            grid = [];
            for (let y = 0; y < GRID_HEIGHT; y++) {
                grid[y] = [];
                for (let x = 0; x < GRID_WIDTH; x++) {
                    if (y < SURFACE_Y) grid[y][x] = CELL_SKY;
                    else if (y === SURFACE_Y) grid[y][x] = CELL_GRASS;
                    else grid[y][x] = CELL_DIRT;
                }
            }
            const entranceX = Math.floor(GRID_WIDTH / 2);
            for (let y = SURFACE_Y; y <= SURFACE_Y + 10; y++) {
                for (let dx = -1; dx <= 1; dx++) grid[y][entranceX + dx] = CELL_TUNNEL;
            }
            for (let x = entranceX - 4; x <= entranceX + 4; x++) {
                for (let y = SURFACE_Y + 8; y <= SURFACE_Y + 12; y++) grid[y][x] = CELL_TUNNEL;
            }
        }

        // Draw queen with amber stripes like reference photo
        function drawQueen(px, py) {
            ctx.save();
            ctx.translate(px, py);

            // Legs
            ctx.strokeStyle = '#2C1810';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 3; i++) {
                const legY = -4 + i * 4;
                ctx.beginPath(); ctx.moveTo(-4, legY); ctx.lineTo(-12, legY - 4 + i * 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(4, legY); ctx.lineTo(12, legY - 4 + i * 2); ctx.stroke();
            }

            // Large abdomen with stripes (like reference)
            ctx.fillStyle = '#1C1008';
            ctx.beginPath();
            ctx.ellipse(-12, 0, 14, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // Amber/orange stripes on abdomen
            ctx.fillStyle = '#D4882C';
            ctx.beginPath(); ctx.ellipse(-18, 0, 3, 8, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#C07820';
            ctx.beginPath(); ctx.ellipse(-12, 0, 2.5, 9, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#D4882C';
            ctx.beginPath(); ctx.ellipse(-6, 0, 2, 7, 0, 0, Math.PI * 2); ctx.fill();

            // Thorax (dark)
            ctx.fillStyle = '#1C1008';
            ctx.beginPath();
            ctx.ellipse(4, 0, 6, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head (dark)
            ctx.beginPath();
            ctx.ellipse(12, 0, 5, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Mandibles
            ctx.strokeStyle = '#2C1810';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(16, -2); ctx.lineTo(20, -4); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(16, 2); ctx.lineTo(20, 4); ctx.stroke();

            // Antennae
            ctx.strokeStyle = '#2C1810';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(14, -3); ctx.quadraticCurveTo(18, -8, 22, -10); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(14, 3); ctx.quadraticCurveTo(18, 8, 22, 10); ctx.stroke();

            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(14, -2, 1.5, 0, Math.PI * 2);
            ctx.arc(14, 2, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Draw worker ant
        function drawWorkerAnt(px, py, task, workProgress) {
            ctx.save();
            ctx.translate(px, py);

            const bodyColor = '#3D1A0A';

            // Legs
            ctx.strokeStyle = bodyColor;
            ctx.lineWidth = 1;
            for (let i = 0; i < 3; i++) {
                const legY = -2 + i * 2;
                ctx.beginPath(); ctx.moveTo(-2, legY); ctx.lineTo(-6, legY - 2 + i); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(2, legY); ctx.lineTo(6, legY - 2 + i); ctx.stroke();
            }

            // Abdomen
            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            ctx.ellipse(-4, 0, 4, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            // Thorax
            ctx.beginPath();
            ctx.ellipse(1, 0, 3, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.beginPath();
            ctx.ellipse(5, 0, 2.5, 2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Antennae
            ctx.strokeStyle = bodyColor;
            ctx.lineWidth = 0.8;
            ctx.beginPath(); ctx.moveTo(6, -1); ctx.quadraticCurveTo(8, -3, 9, -4); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(6, 1); ctx.quadraticCurveTo(8, 3, 9, 4); ctx.stroke();

            ctx.restore();

            // Work progress bar
            if (workProgress > 0) {
                const barWidth = 16;
                const progress = task === TASK_DIG ? workProgress / DIG_TIME : workProgress / FARM_BUILD_TIME;
                ctx.fillStyle = '#222';
                ctx.fillRect(px - barWidth/2, py - 12, barWidth, 3);
                ctx.fillStyle = task === TASK_DIG ? '#F39C12' : '#27AE60';
                ctx.fillRect(px - barWidth/2, py - 12, barWidth * progress, 3);
            }
        }

        function drawEgg(px, py, progress) {
            ctx.fillStyle = '#FFF8DC';
            ctx.beginPath();
            ctx.ellipse(px, py, 4, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#DAA520';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Hatch progress
            const barWidth = 12;
            ctx.fillStyle = '#333';
            ctx.fillRect(px - barWidth/2, py + 8, barWidth, 2);
            ctx.fillStyle = '#E74C3C';
            ctx.fillRect(px - barWidth/2, py + 8, barWidth * progress, 2);
        }

        function drawFarm(x, y) {
            const sx = x * CELL_SIZE, sy = y * CELL_SIZE;
            ctx.fillStyle = '#5D4037';
            ctx.fillRect(sx, sy, CELL_SIZE, CELL_SIZE);
            ctx.fillStyle = '#4E342E';
            for (let i = 0; i < 4; i++) ctx.fillRect(sx + 1, sy + 2 + i * 4, CELL_SIZE - 2, 2);

            // Plants
            [[4,4],[12,4],[8,8],[4,12],[12,12]].forEach(([px,py]) => {
                ctx.strokeStyle = '#2E7D32';
                ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(sx+px, sy+py+3); ctx.lineTo(sx+px, sy+py-1); ctx.stroke();
                ctx.fillStyle = '#4CAF50';
                ctx.beginPath(); ctx.ellipse(sx+px-2, sy+py, 2, 1, -0.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(sx+px+2, sy+py, 2, 1, 0.5, 0, Math.PI*2); ctx.fill();
            });
        }

        class Ant {
            constructor(x, y, isQueen = false) {
                // Store pixel positions
                this.px = x * CELL_SIZE + CELL_SIZE / 2;
                this.py = y * CELL_SIZE + CELL_SIZE / 2;
                this.isQueen = isQueen;
                this.task = TASK_IDLE;
                this.targetX = null;
                this.targetY = null;
                this.workProgress = 0;
                this.angle = Math.random() * Math.PI * 2;
            }

            getGridX() { return Math.floor(this.px / CELL_SIZE); }
            getGridY() { return Math.floor(this.py / CELL_SIZE); }

            canMoveToPixel(px, py) {
                const gx = Math.floor(px / CELL_SIZE);
                const gy = Math.floor(py / CELL_SIZE);
                if (gx < 0 || gx >= GRID_WIDTH || gy < 0 || gy >= GRID_HEIGHT) return false;
                const cell = grid[gy][gx];
                return cell === CELL_TUNNEL || cell === CELL_FARM || cell === CELL_GRASS;
            }

            update(deltaTime) {
                if (this.isQueen) return;

                if (this.task === TASK_DIG) {
                    this.performDigging(deltaTime);
                } else if (this.task === TASK_FARM) {
                    this.performFarming(deltaTime);
                } else {
                    this.checkForWork();
                    this.wander(deltaTime);
                }
            }

            checkForWork() {
                if (digQueue.length > 0) {
                    const target = digQueue.shift();
                    this.task = TASK_DIG;
                    this.targetX = target.x;
                    this.targetY = target.y;
                    return;
                }
                if (farmQueue.length > 0) {
                    const target = farmQueue.shift();
                    this.task = TASK_FARM;
                    this.targetX = target.x;
                    this.targetY = target.y;
                    return;
                }
            }

            getDistanceToTarget() {
                if (this.targetX === null) return Infinity;
                const tx = this.targetX * CELL_SIZE + CELL_SIZE / 2;
                const ty = this.targetY * CELL_SIZE + CELL_SIZE / 2;
                return Math.sqrt((this.px - tx) ** 2 + (this.py - ty) ** 2);
            }

            moveTowardsTarget(deltaTime) {
                const tx = this.targetX * CELL_SIZE + CELL_SIZE / 2;
                const ty = this.targetY * CELL_SIZE + CELL_SIZE / 2;
                const dx = tx - this.px;
                const dy = ty - this.py;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < CELL_SIZE) return true; // Close enough

                const speed = ANT_SPEED * deltaTime;
                const nx = this.px + (dx / dist) * speed;
                const ny = this.py + (dy / dist) * speed;

                if (this.canMoveToPixel(nx, ny)) {
                    this.px = nx;
                    this.py = ny;
                    this.angle = Math.atan2(dy, dx);
                }
                return false;
            }

            performDigging(deltaTime) {
                if (this.targetX === null || this.targetY === null) {
                    this.task = TASK_IDLE;
                    return;
                }
                if (grid[this.targetY][this.targetX] !== CELL_DIRT) {
                    this.task = TASK_IDLE;
                    this.targetX = null;
                    this.targetY = null;
                    this.workProgress = 0;
                    return;
                }

                if (this.getDistanceToTarget() < CELL_SIZE * 1.5) {
                    this.workProgress += deltaTime;
                    if (this.workProgress >= DIG_TIME) {
                        grid[this.targetY][this.targetX] = CELL_TUNNEL;
                        this.workProgress = 0;
                        this.targetX = null;
                        this.targetY = null;
                        this.task = TASK_IDLE;
                    }
                } else {
                    this.moveTowardsTarget(deltaTime);
                }
            }

            performFarming(deltaTime) {
                if (this.targetX === null || this.targetY === null) {
                    this.task = TASK_IDLE;
                    return;
                }
                const cell = grid[this.targetY][this.targetX];
                if (cell !== CELL_TUNNEL && cell !== CELL_FARM) {
                    this.task = TASK_IDLE;
                    this.targetX = null;
                    this.targetY = null;
                    this.workProgress = 0;
                    return;
                }

                if (cell === CELL_FARM) {
                    if (this.getDistanceToTarget() > CELL_SIZE) {
                        this.moveTowardsTarget(deltaTime);
                    }
                    return;
                }

                if (this.getDistanceToTarget() < CELL_SIZE * 1.5) {
                    this.workProgress += deltaTime;
                    if (this.workProgress >= FARM_BUILD_TIME) {
                        grid[this.targetY][this.targetX] = CELL_FARM;
                        farms.push(new Farm(this.targetX, this.targetY));
                        this.workProgress = 0;
                    }
                } else {
                    this.moveTowardsTarget(deltaTime);
                }
            }

            wander(deltaTime) {
                // Random wandering with smooth movement
                this.angle += (Math.random() - 0.5) * 0.1;
                const speed = ANT_SPEED * deltaTime * 0.5;
                const nx = this.px + Math.cos(this.angle) * speed;
                const ny = this.py + Math.sin(this.angle) * speed;

                if (this.canMoveToPixel(nx, ny)) {
                    this.px = nx;
                    this.py = ny;
                } else {
                    this.angle += Math.PI / 2 + Math.random();
                }
            }

            draw() {
                if (this.isQueen) {
                    drawQueen(this.px, this.py);
                } else {
                    drawWorkerAnt(this.px, this.py, this.task, this.workProgress);
                }
            }
        }

        class Egg {
            constructor(px, py) {
                this.px = px;
                this.py = py;
                this.createdAt = Date.now();
            }
            isReady() { return Date.now() - this.createdAt >= EGG_HATCH_TIME; }
            getProgress() { return (Date.now() - this.createdAt) / EGG_HATCH_TIME; }
            draw() { drawEgg(this.px, this.py, this.getProgress()); }
        }

        class Farm {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.lastProduce = Date.now();
            }
            update() {
                if (Date.now() - this.lastProduce >= FARM_PRODUCE_INTERVAL) {
                    food += FARM_FOOD_AMOUNT;
                    this.lastProduce = Date.now();
                }
            }
        }

        function hasAdjacentTunnel(x, y) {
            return [{dx:0,dy:-1},{dx:0,dy:1},{dx:-1,dy:0},{dx:1,dy:0}].some(c => {
                const nx = x + c.dx, ny = y + c.dy;
                return ny >= 0 && ny < GRID_HEIGHT && nx >= 0 && nx < GRID_WIDTH &&
                       (grid[ny][nx] === CELL_TUNNEL || grid[ny][nx] === CELL_FARM);
            });
        }

        function getIdleAnts() { return ants.filter(a => a.task === TASK_IDLE); }
        function getFarmersAtFarm(x, y) { return ants.filter(a => a.task === TASK_FARM && a.targetX === x && a.targetY === y); }

        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            initGrid();

            const queenX = Math.floor(GRID_WIDTH / 2);
            const queenY = SURFACE_Y + 10;
            queen = new Ant(queenX, queenY, true);

            canvas.addEventListener('click', handleClick);
            canvas.addEventListener('mousemove', handleMouseMove);
            requestAnimationFrame(gameLoop);
        }

        function handleMouseMove(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = Math.floor((event.clientX - rect.left) * scaleX / CELL_SIZE);
            const mouseY = Math.floor((event.clientY - rect.top) * scaleY / CELL_SIZE);
            if (mouseX >= 0 && mouseX < GRID_WIDTH && mouseY >= 0 && mouseY < GRID_HEIGHT) {
                highlightedCell = {x: mouseX, y: mouseY};
            } else {
                highlightedCell = null;
            }
        }

        function handleClick(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = Math.floor((event.clientX - rect.left) * scaleX / CELL_SIZE);
            const clickY = Math.floor((event.clientY - rect.top) * scaleY / CELL_SIZE);
            if (clickX < 0 || clickX >= GRID_WIDTH || clickY < 0 || clickY >= GRID_HEIGHT) return;
            selectedCell = {x: clickX, y: clickY, type: grid[clickY][clickX]};
            updateSelectedUI();
        }

        function assignDigger(x, y) {
            const idleAnts = getIdleAnts();
            if (idleAnts.length > 0) {
                const ant = idleAnts[0];
                ant.task = TASK_DIG;
                ant.targetX = x;
                ant.targetY = y;
                ant.workProgress = 0;
            } else {
                if (!digQueue.some(d => d.x === x && d.y === y)) digQueue.push({x, y});
            }
            selectedCell = null;
            updateSelectedUI();
        }

        function assignFarmer(x, y) {
            const idleAnts = getIdleAnts();
            if (idleAnts.length > 0) {
                const ant = idleAnts[0];
                ant.task = TASK_FARM;
                ant.targetX = x;
                ant.targetY = y;
                ant.workProgress = 0;
            } else {
                if (!farmQueue.some(f => f.x === x && f.y === y)) farmQueue.push({x, y});
            }
            selectedCell = null;
            updateSelectedUI();
        }

        function updateSelectedUI() {
            const info = document.getElementById('selectedInfo');
            const title = document.getElementById('selectedTitle');
            const desc = document.getElementById('selectedDesc');
            const buttons = document.getElementById('actionButtons');
            const idleNote = document.getElementById('idleNote');

            if (!selectedCell) { info.style.display = 'none'; return; }

            info.style.display = 'block';
            info.className = 'selected-info';
            buttons.innerHTML = '';
            const idleCount = getIdleAnts().length;
            idleNote.textContent = `Idle workers: ${idleCount}`;
            const {x, y, type: cell} = selectedCell;

            if (cell === CELL_DIRT && hasAdjacentTunnel(x, y)) {
                info.classList.add('dirt');
                title.textContent = 'Diggable Dirt';
                desc.textContent = 'Click to assign a digger.';
                const btn = document.createElement('button');
                btn.className = 'btn-dig';
                btn.textContent = idleCount > 0 ? 'Assign Digger' : 'Queue Dig Task';
                btn.onclick = () => assignDigger(x, y);
                buttons.appendChild(btn);
            } else if (cell === CELL_DIRT) {
                info.classList.add('dirt');
                title.textContent = 'Solid Dirt';
                desc.textContent = 'Not adjacent to tunnel.';
            } else if (cell === CELL_TUNNEL) {
                const qgx = queen.getGridX(), qgy = queen.getGridY();
                if (qgx === x && qgy === y) {
                    title.textContent = "Queen's Chamber";
                    desc.textContent = 'Cannot build here.';
                } else {
                    info.classList.add('tunnel');
                    title.textContent = 'Tunnel';
                    desc.textContent = 'Build a farm here.';
                    const btn = document.createElement('button');
                    btn.className = 'btn-farm';
                    btn.textContent = idleCount > 0 ? 'Build Farm' : 'Queue Farm';
                    btn.onclick = () => assignFarmer(x, y);
                    buttons.appendChild(btn);
                }
            } else if (cell === CELL_FARM) {
                info.classList.add('farm');
                title.textContent = 'Farm';
                desc.textContent = `Farmers: ${getFarmersAtFarm(x, y).length}`;
                const btn = document.createElement('button');
                btn.className = 'btn-farm';
                btn.textContent = idleCount > 0 ? 'Assign Farmer' : 'Queue Farmer';
                btn.onclick = () => assignFarmer(x, y);
                buttons.appendChild(btn);
            } else {
                title.textContent = cell === CELL_GRASS ? 'Surface' : 'Sky';
                desc.textContent = '';
            }
        }

        function updateStats() {
            const idle = ants.filter(a => a.task === TASK_IDLE).length;
            const diggers = ants.filter(a => a.task === TASK_DIG).length;
            const farmers = ants.filter(a => a.task === TASK_FARM).length;
            const total = ants.length + 1;
            const produced = farms.length * FARM_FOOD_AMOUNT / (FARM_PRODUCE_INTERVAL / 1000);
            const consumed = total / (FOOD_CONSUME_INTERVAL / 1000);
            const rate = (produced - consumed).toFixed(2);

            document.getElementById('foodCount').textContent = Math.floor(food);
            document.getElementById('eggCount').textContent = eggs.length;
            document.getElementById('workerCount').textContent = ants.length;
            document.getElementById('idleCount').textContent = idle;
            document.getElementById('diggerCount').textContent = diggers;
            document.getElementById('farmerCount').textContent = farmers;
            document.getElementById('farmCount').textContent = farms.length;
            document.getElementById('foodRate').textContent = rate;

            const foodEl = document.getElementById('foodCount');
            foodEl.className = 'stat-value' + (food < 10 ? ' danger' : food < 30 ? ' warning' : '');
            const rateEl = document.getElementById('foodRate');
            rateEl.className = 'stat-value' + (parseFloat(rate) < 0 ? ' danger' : parseFloat(rate) < 0.1 ? ' warning' : '');

            if (selectedCell) document.getElementById('idleNote').textContent = `Idle workers: ${idle}`;
        }

        let lastTime = Date.now();
        function gameLoop() {
            if (!gameRunning) return;
            const now = Date.now();
            const deltaTime = now - lastTime;
            lastTime = now;
            update(deltaTime);
            render();
            updateStats();
            requestAnimationFrame(gameLoop);
        }

        function update(deltaTime) {
            const now = Date.now();

            // Queen lays eggs
            if (now - lastQueenLay >= QUEEN_LAY_INTERVAL) {
                const spots = [];
                for (let dy = -2; dy <= 2; dy++) {
                    for (let dx = -2; dx <= 2; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const gx = queen.getGridX() + dx, gy = queen.getGridY() + dy;
                        if (gx >= 0 && gx < GRID_WIDTH && gy >= 0 && gy < GRID_HEIGHT) {
                            const cell = grid[gy][gx];
                            if ((cell === CELL_TUNNEL || cell === CELL_FARM) &&
                                !eggs.some(e => Math.abs(e.px - (gx*CELL_SIZE+CELL_SIZE/2)) < CELL_SIZE && Math.abs(e.py - (gy*CELL_SIZE+CELL_SIZE/2)) < CELL_SIZE)) {
                                spots.push({x: gx, y: gy});
                            }
                        }
                    }
                }
                if (spots.length > 0) {
                    const spot = spots[Math.floor(Math.random() * spots.length)];
                    eggs.push(new Egg(spot.x * CELL_SIZE + CELL_SIZE/2, spot.y * CELL_SIZE + CELL_SIZE/2));
                }
                lastQueenLay = now;
            }

            // Hatch eggs
            for (let i = eggs.length - 1; i >= 0; i--) {
                if (eggs[i].isReady()) {
                    const egg = eggs[i];
                    const newAnt = new Ant(0, 0, false);
                    newAnt.px = egg.px;
                    newAnt.py = egg.py;
                    ants.push(newAnt);
                    eggs.splice(i, 1);
                }
            }

            for (const ant of ants) ant.update(deltaTime);
            for (const farm of farms) farm.update();

            // Consume food
            if (now - lastFoodConsume >= FOOD_CONSUME_INTERVAL) {
                food -= ants.length + 1;
                lastFoodConsume = now;
                if (food <= 0) {
                    gameRunning = false;
                    document.getElementById('gameOver').style.display = 'block';
                }
            }

            digQueue = digQueue.filter(d => grid[d.y][d.x] === CELL_DIRT);
            farmQueue = farmQueue.filter(f => grid[f.y][f.x] === CELL_TUNNEL || grid[f.y][f.x] === CELL_FARM);
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            for (let y = 0; y < GRID_HEIGHT; y++) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    const cell = grid[y][x];
                    const sx = x * CELL_SIZE, sy = y * CELL_SIZE;

                    if (cell === CELL_SKY) {
                        ctx.fillStyle = '#87CEEB';
                        ctx.fillRect(sx, sy, CELL_SIZE, CELL_SIZE);
                    } else if (cell === CELL_GRASS) {
                        ctx.fillStyle = '#228B22';
                        ctx.fillRect(sx, sy, CELL_SIZE, CELL_SIZE);
                    } else if (cell === CELL_DIRT) {
                        const shade = ((x * 7 + y * 13) % 20) - 10;
                        ctx.fillStyle = `rgb(${139 + shade}, ${69 + shade/2}, ${19 + shade/3})`;
                        ctx.fillRect(sx, sy, CELL_SIZE, CELL_SIZE);
                    } else if (cell === CELL_TUNNEL) {
                        // Beige tunnel background
                        ctx.fillStyle = '#D4C4A8';
                        ctx.fillRect(sx, sy, CELL_SIZE, CELL_SIZE);
                    } else if (cell === CELL_FARM) {
                        drawFarm(x, y);
                    }
                }
            }

            // Draw white edge highlights for tunnels
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 2;
            for (let y = 0; y < GRID_HEIGHT; y++) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    if (grid[y][x] === CELL_TUNNEL || grid[y][x] === CELL_FARM) {
                        const sx = x * CELL_SIZE, sy = y * CELL_SIZE;
                        // Check each edge for dirt neighbor
                        if (y > 0 && grid[y-1][x] === CELL_DIRT) {
                            ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + CELL_SIZE, sy); ctx.stroke();
                        }
                        if (y < GRID_HEIGHT-1 && grid[y+1][x] === CELL_DIRT) {
                            ctx.beginPath(); ctx.moveTo(sx, sy + CELL_SIZE); ctx.lineTo(sx + CELL_SIZE, sy + CELL_SIZE); ctx.stroke();
                        }
                        if (x > 0 && grid[y][x-1] === CELL_DIRT) {
                            ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + CELL_SIZE); ctx.stroke();
                        }
                        if (x < GRID_WIDTH-1 && grid[y][x+1] === CELL_DIRT) {
                            ctx.beginPath(); ctx.moveTo(sx + CELL_SIZE, sy); ctx.lineTo(sx + CELL_SIZE, sy + CELL_SIZE); ctx.stroke();
                        }
                    }
                }
            }

            // Draw queued tasks
            ctx.fillStyle = 'rgba(255, 165, 0, 0.4)';
            for (const t of digQueue) ctx.fillRect(t.x * CELL_SIZE, t.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            ctx.fillStyle = 'rgba(50, 205, 50, 0.4)';
            for (const t of farmQueue) ctx.fillRect(t.x * CELL_SIZE, t.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

            // Highlight
            if (highlightedCell) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.strokeRect(highlightedCell.x * CELL_SIZE + 1, highlightedCell.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
            }

            // Selection
            if (selectedCell) {
                ctx.strokeStyle = '#00FF00';
                ctx.lineWidth = 3;
                ctx.strokeRect(selectedCell.x * CELL_SIZE, selectedCell.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }

            // Draw eggs
            for (const egg of eggs) egg.draw();

            // Draw queen
            queen.draw();

            // Draw workers
            for (const ant of ants) ant.draw();
        }

        window.onload = init;
    </script>
</body>
</html>
